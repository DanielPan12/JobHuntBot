<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobHuntBot Dashboard · 求职进度看板</title>
<style>
  :root {
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* blue   - 第一类 */
    --series-2:       #1baf7a; /* aqua   - 第二类 */
    --series-3:       #eda100; /* yellow - 第三类 */
    --series-x:       #898781; /* 未分类 */
    --status-good:    #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
    --status-critical:#d03b3b;
    --chip-bg:        #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-2:       #199e70;
      --series-3:       #c98500;
      --series-x:       #898781;
      --status-good:    #0ca30c;
      --status-warning: #fab219;
      --status-serious: #ec835a;
      --status-critical:#d03b3b;
      --chip-bg:        #26262388;
    }
  }
  :root[data-theme="light"] {
    --surface-1: #fcfcfb; --page-plane: #f9f9f7; --text-primary:#0b0b0b; --text-secondary:#52514e;
    --text-muted:#898781; --gridline:#e1e0d9; --border:rgba(11,11,11,0.10);
    --series-1:#2a78d6; --series-2:#1baf7a; --series-3:#eda100; --series-x:#898781; --chip-bg:#f0efec;
  }
  :root[data-theme="dark"] {
    --surface-1:#1a1a19; --page-plane:#0d0d0d; --text-primary:#ffffff; --text-secondary:#c3c2b7;
    --text-muted:#898781; --gridline:#2c2c2a; --border:rgba(255,255,255,0.10);
    --series-1:#3987e5; --series-2:#199e70; --series-3:#c98500; --series-x:#898781; --chip-bg:#26262388;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane); color: var(--text-primary);
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { font-size: 12px; color: var(--text-muted); }
  .btn {
    font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--series-1); }
  .btn-primary { background: var(--series-1); color: #fff; border-color: var(--series-1); }
  .btn-row { display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }
  .hidden { display: none !important; }

  #connect-screen { text-align:center; padding: 80px 20px; }
  #connect-screen p { color: var(--text-secondary); max-width: 480px; margin: 12px auto 24px; line-height:1.6; }
  #connect-screen .warn { color: var(--status-serious); font-size: 13px; margin-top:16px; }

  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 380px) { .tiles { grid-template-columns: 1fr; } }
  .tile {
    display: flex; flex-direction: column; align-items: flex-start;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px; cursor: pointer; text-align: left; transition: border-color .15s;
  }
  .tile:hover { border-color: var(--series-1); }
  .tile .label { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
  .tile .value { font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  .view-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .view-header h2 { margin:0; font-size:20px; }
  .back-link { font-size:13px; color: var(--series-1); cursor:pointer; background:none; border:none; padding:0; font:inherit; }

  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .filters select, .filters input[type=text] {
    font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  }

  .section-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin: 24px 0 10px; }
  .section-title:first-child { margin-top: 0; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
  }
  .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .card-title { font-size:15px; font-weight:600; }
  .card-sub { font-size: 13px; color: var(--text-secondary); margin-top:2px; }
  .card-right { text-align:right; font-size:12px; color: var(--text-muted); white-space:nowrap; }
  .tags { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .chip {
    display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:3px 8px;
    border-radius:999px; background: var(--chip-bg); color: var(--text-secondary);
  }
  .chip-cat1 { color: var(--series-1); background: color-mix(in srgb, var(--series-1) 14%, transparent); }
  .chip-cat2 { color: var(--series-2); background: color-mix(in srgb, var(--series-2) 14%, transparent); }
  .chip-cat3 { color: var(--series-3); background: color-mix(in srgb, var(--series-3) 16%, transparent); }
  .chip-good { color: var(--status-good); background: color-mix(in srgb, var(--status-good) 14%, transparent); }
  .chip-critical { color: var(--status-critical); background: color-mix(in srgb, var(--status-critical) 14%, transparent); }
  .chip-warning { color: var(--status-warning); background: color-mix(in srgb, var(--status-warning) 18%, transparent); }
  .chip-agent { color: var(--series-1); }
  .chip-user { color: var(--text-muted); }

  .detail { margin-top:10px; padding-top:10px; border-top: 1px solid var(--gridline); font-size:13px; color: var(--text-secondary); line-height:1.6; display:none; }
  .card.open .detail { display:block; }
  .pending-role + .pending-role { margin-top:14px; padding-top:14px; border-top:1px solid var(--gridline); }
  .pending-role h3 { margin:0 0 6px; font-size:14px; color:var(--text-primary); }
  .detail dt { color: var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.03em; margin-top:8px; }
  .detail dt:first-child { margin-top:0; }
  .detail dd { margin:2px 0 0; }
  .detail a { color: var(--series-1); }
  .view-note { font-size:13px; color:var(--text-secondary); line-height:1.6; }
  .action-card { overflow-wrap:anywhere; }
  .action-card .card-sub { line-height:1.6; }
  .action-section + .action-section { border-top:1px dashed var(--gridline); margin-top:12px; padding-top:12px; }

  .empty { color: var(--text-muted); font-size:14px; padding: 24px 0; text-align:center; }
  .timeline-item { padding: 4px 0; border-bottom: 1px dashed var(--gridline); }
  .timeline-item:last-child { border-bottom:none; }

  .end-progress { margin-top:12px; padding-top:12px; border-top: 1px dashed var(--gridline); }
  .end-choices { display:flex; gap:8px; margin-top:8px; }
  .btn-good { color: var(--status-good); border-color: var(--status-good); }
  .btn-bad { color: var(--status-critical); border-color: var(--status-critical); }
  .btn:disabled { opacity: .5; cursor: default; }

  .calendar-section { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-top: 24px; }
  .calendar-week { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .calendar-day { flex: 1 1 130px; min-width: 130px; border: 1px solid var(--gridline); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .calendar-day.is-today { border-color: var(--series-1); }
  .calendar-day-header { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .calendar-day.is-today .calendar-day-header { color: var(--series-1); }
  .calendar-event { background: var(--chip-bg); border-radius: 8px; padding: 6px 8px; font-size: 12px; line-height: 1.4; }
  .calendar-event-time { font-weight: 600; }
  .calendar-event-actions { display:flex; gap:4px; margin-top:4px; }
  .calendar-event-actions button { font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-muted); cursor: pointer; }
  .calendar-empty-day { font-size: 12px; color: var(--text-muted); }
  .calendar-add-row { margin-top: 14px; text-align: center; }
  .calendar-form { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--gridline); display: flex; flex-direction: column; gap: 10px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; position: relative; }
  .form-row label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-muted); flex: 1; min-width: 160px; }
  .form-row input { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--page-plane); color: var(--text-primary); }
  .cal-company-results { position: absolute; top: 100%; left: 0; right: 0; z-index: 5; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; max-height: 200px; overflow-y: auto; margin-top: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .cal-company-results button { display: block; width: 100%; text-align: left; padding: 8px 10px; font-size: 13px; background: none; border: none; color: var(--text-primary); cursor: pointer; font: inherit; }
  .cal-company-results button:hover { background: var(--chip-bg); }
  .cal-selected-job { font-size: 12px; color: var(--series-1); margin-top: 2px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .cal-form-error { color: var(--status-serious); font-size: 12px; margin: 0; }
</style>
</head>
<body>

<header>
  <h1>JobHuntBot Dashboard · 求职进度看板</h1>
  <div class="btn-row">
    <span class="meta" id="last-updated"></span>
    <button class="btn" id="theme-toggle">🌓</button>
    <button class="btn hidden" id="refresh-btn">刷新</button>
  </div>
</header>

<main>

  <div id="connect-screen">
    <h2 id="connect-title">正在读取数据…</h2>
    <p id="connect-desc">从同目录下的 job_pool.csv 等文件读取最新数据。</p>
    <p class="warn" id="connect-warn"></p>
  </div>

  <div id="app" class="hidden">

    <div id="home-view">
      <div class="tiles">
        <button class="tile" data-view="applied">
          <div class="label">已投递</div>
          <div class="value" id="tile-applied">–</div>
          <div class="sub">进行中的投递 · 按岗位计数</div>
        </button>
        <button class="tile" data-view="pending">
          <div class="label">未投递</div>
          <div class="value" id="tile-pending">–</div>
          <div class="sub">尚无投递记录 · 按公司计数</div>
        </button>
        <button class="tile" data-view="rejected">
          <div class="label">已挂</div>
          <div class="value" id="tile-rejected">–</div>
          <div class="sub">已收到拒绝结果 · 按岗位计数</div>
        </button>
        <button class="tile" data-view="offers">
          <div class="label">拿到 Offer</div>
          <div class="value" id="tile-offers">–</div>
          <div class="sub">已收到录用结果 · 按岗位计数</div>
        </button>
        <button class="tile" data-view="actions">
          <div class="label">集中待办</div>
          <div class="value" id="tile-actions">–</div>
          <div class="sub">待补信息、流程阻塞与提交后修正</div>
        </button>
      </div>

      <div class="section-title">未来 7 天日程</div>
      <div class="calendar-section">
        <div id="calendar-week" class="calendar-week"></div>
        <div class="calendar-add-row">
          <button class="btn btn-primary" id="calendar-add-btn">+ 添加日程</button>
        </div>
        <div id="calendar-form" class="calendar-form hidden">
          <div class="form-row">
            <label>日期<input type="date" id="cal-date"></label>
            <label>时间<input type="time" id="cal-time"></label>
          </div>
          <div class="form-row">
            <label>公司 / 岗位（从已投递里搜索）
              <input type="text" id="cal-company-search" placeholder="输入公司名称或岗位关键词…" autocomplete="off">
            </label>
            <div id="cal-company-results" class="cal-company-results hidden"></div>
          </div>
          <div id="cal-selected-job" class="cal-selected-job hidden"></div>
          <div class="form-row">
            <label>事件内容
              <input type="text" id="cal-event-type" list="cal-event-suggestions" placeholder="比如：二轮面试、测评…">
            </label>
          </div>
          <datalist id="cal-event-suggestions">
            <option value="笔试">
            <option value="测评">
            <option value="一面">
            <option value="二面">
            <option value="三面">
            <option value="HR面">
            <option value="终面">
            <option value="谈薪">
          </datalist>
          <p id="cal-form-error" class="cal-form-error hidden"></p>
          <div class="form-actions">
            <button class="btn" id="cal-cancel-btn">取消</button>
            <button class="btn btn-primary" id="cal-save-btn">保存</button>
          </div>
        </div>
      </div>
    </div>

    <div id="applied-view" class="hidden">
      <div class="view-header">
        <div><button class="back-link" data-back>← 返回</button><h2>已投递</h2></div>
        <div class="filters">
          <select id="applied-filter-cat"><option value="">全部分类</option></select>
          <input type="text" id="applied-search" placeholder="搜索公司…">
        </div>
      </div>
      <div id="applied-list"></div>
    </div>

    <div id="pending-view" class="hidden">
      <div class="view-header">
        <div><button class="back-link" data-back>← 返回</button><h2>未投递</h2></div>
        <div class="filters">
          <select id="pending-filter-cat"><option value="">全部分类</option></select>
          <select id="pending-filter-priority"><option value="">全部优先级</option></select>
          <select id="pending-filter-city"><option value="">全部城市</option></select>
          <input type="text" id="pending-search" placeholder="搜索公司…">
        </div>
      </div>
      <div class="section-title" id="pending-open-title">已确认开放，还没投</div>
      <div id="pending-open-list"></div>
      <div class="section-title" id="pending-notopen-title">未开 / 状态不明</div>
      <div id="pending-notopen-list"></div>
    </div>

    <div id="actions-view" class="hidden">
      <div class="view-header">
        <div><button class="back-link" data-back>← 返回</button><h2>集中待办</h2></div>
        <div class="filters">
          <input type="text" id="actions-search" placeholder="搜索公司、岗位或缺漏…" aria-label="搜索集中待办">
          <button class="btn" id="actions-expand">展开全部</button>
        </div>
      </div>
      <p class="view-note">这里汇总岗位池中的待补信息、流程阻塞和未关闭的问题。同一岗位的多个事项一起保留；已有投递的公司也会显示。展开可查看已完成进度、剩余事项和下一步。</p>
      <div class="section-title" id="actions-count"></div>
      <div id="actions-list"></div>
    </div>

    <div id="rejected-view" class="hidden">
      <div class="view-header">
        <div><button class="back-link" data-back>← 返回</button><h2>已挂</h2></div>
        <div class="filters">
          <select id="rejected-filter-cat" aria-label="已挂岗位企业分类"><option value="">全部分类</option></select>
          <input type="text" id="rejected-search" placeholder="搜索公司或岗位…" aria-label="搜索已挂岗位">
        </div>
      </div>
      <div id="rejected-list"></div>
    </div>

    <div id="offers-view" class="hidden">
      <div class="view-header">
        <div><button class="back-link" data-back>← 返回</button><h2>拿到 Offer</h2></div>
        <div class="filters">
          <select id="offers-filter-cat" aria-label="Offer 岗位企业分类"><option value="">全部分类</option></select>
          <input type="text" id="offers-search" placeholder="搜索公司或岗位…" aria-label="搜索 Offer 岗位">
        </div>
      </div>
      <div id="offers-list"></div>
    </div>

  </div>

</main>

<script src="./dashboard-model.js"></script>
<script>
(function(){

  // ---------- theme ----------
  const root = document.documentElement;
  function applyTheme(t) {
    if (t) root.setAttribute('data-theme', t);
    else root.removeAttribute('data-theme');
  }
  applyTheme(localStorage.getItem('dash-theme'));
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const cur = root.getAttribute('data-theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    localStorage.setItem('dash-theme', next);
    applyTheme(next);
  });

  // ---------- csv parsing ----------
  function parseCSV(text) {
    const rows = parseCSVRows(text);
    const header = rows.shift();
    const dataRows = rows.filter(row => !(row.length === 1 && row[0] === ''));
    validateRows(header, dataRows);
    return dataRows.map(row => Object.fromEntries(header.map((column, index) => [column, row[index]])));
  }

  function parseCSVRows(text) {
    text = String(text).replace(/^\uFEFF/, '');
    const rows = [];
    let row = [], field = '', quoted = false, closed = false, started = false;
    const finishField = () => { row.push(field); field = ''; closed = false; started = false; };
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') { quoted = false; closed = true; }
        else field += c;
      } else if (c === ',') finishField();
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        finishField(); rows.push(row); row = [];
      } else if (closed) throw new Error('CSV has text after a closing quote');
      else if (c === '"') {
        if (started) throw new Error('CSV has a quote inside an unquoted field');
        quoted = true; started = true;
      } else { field += c; started = true; }
    }
    if (quoted) throw new Error('CSV has an unterminated quoted field');
    if (started || closed || row.length) { finishField(); rows.push(row); }
    return rows;
  }

  function validateRows(header, dataRows) {
    if (!Array.isArray(header) || !header.length || header.some(name => !name.trim())) {
      throw new Error('CSV needs a non-empty header');
    }
    if (new Set(header).size !== header.length) throw new Error('CSV contains duplicate column names');
    dataRows.forEach((row, index) => {
      if (row.length !== header.length) {
        throw new Error(`CSV record ${index + 2} has ${row.length} columns; expected ${header.length}`);
      }
      if (row.every((value, column) => value === header[column])) {
        throw new Error(`CSV record ${index + 2} repeats the header`);
      }
    });
  }


  // ---------- data ----------
  const data = { jobPool: [], appLog: [], followUp: [], blockerQueue: [], companyCategories: {} };

  async function readCSVFile(name) {
    const res = await fetch('./' + name + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(name + ' 读取失败 (HTTP ' + res.status + ')');
    const text = await res.text();
    try { return parseCSV(text); }
    catch (error) { throw new Error(name + ' 数据格式错误：' + error.message); }
  }

  async function loadAll() {
    const warnEl = document.getElementById('connect-warn');
    try {
      const categoryResponse = await fetch('./company_categories.json?t=' + Date.now(), { cache: 'no-store' });
      if (!categoryResponse.ok) throw new Error('公司分类读取失败 (HTTP ' + categoryResponse.status + ')');
      data.companyCategories = (await categoryResponse.json()).companies;
      if (!data.companyCategories || typeof data.companyCategories !== 'object') throw new Error('公司分类数据格式错误');
      data.jobPool = await readCSVFile('job_pool.csv');
      // Row position in job_pool.csv (excluding header) — this is how the
      // "record outcome" action tells the server which row to update.
      data.jobPool.forEach((r, i) => { r.__rowIndex = i; });
      [data.appLog, data.followUp, data.blockerQueue] = await Promise.all([
        readCSVFile('application_log.csv'), readCSVFile('follow_up.csv'), readCSVFile('blocker_queue.csv'),
      ]);
      // Row position in follow_up.csv (excluding header) — needed to edit/delete a calendar event.
      data.followUp.forEach((r, i) => { r.__rowIndex = i; });
    } catch (e) {
      document.getElementById('connect-title').textContent = '读取数据失败';
      document.getElementById('connect-desc').textContent = '';
      warnEl.textContent = e.message + '——请确认是通过本地服务器打开的（双击"启动仪表盘.bat"），而不是直接双击 dashboard.html。';
      return;
    }
    document.getElementById('last-updated').textContent =
      '最后读取：' + new Date().toLocaleString('zh-CN', {hour12:false});
    document.getElementById('connect-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('refresh-btn').classList.remove('hidden');
    renderHome();
    renderApplied();
    renderPending();
    renderOutcome('rejected', 'Rejected');
    renderOutcome('offers', 'Offer');
    renderActions();
    renderCalendar();
  }

  // ---------- categorization helpers ----------
  function category(row) {
    return DashboardModel.companyClassification(row, data.companyCategories)?.category || '待分类';
  }
  function compareCategories(a, b) {
    const order = label => {
      const index = DashboardModel.categoryNames.indexOf(label);
      return index < 0 ? DashboardModel.categoryNames.length : index;
    };
    return order(a) - order(b);
  }
  function classificationDetail(row) {
    const info = DashboardModel.companyClassification(row, data.companyCategories);
    if (!info) return '<dt>企业分类</dt><dd>待补充公司分类</dd>';
    const basis = { existing: '沿用已有分类', recommended: '自动推荐，可调整', user: '用户确认' }[info.basis] || '已记录';
    return `<dt>企业分类</dt><dd>${esc(info.category)} · ${esc(basis)}${info.updated_on ? ' · ' + esc(info.updated_on) : ''}<br>${esc(info.reason)}</dd>`;
  }
  function catChipClass(cat) {
    if (cat === '第一类') return 'chip-cat1';
    if (cat === '第二类') return 'chip-cat2';
    if (cat === '第三类') return 'chip-cat3';
    return '';
  }
  // "已确认开放" 曾经是从 notes/next_action 自由文本里用关键词+否定词猜的，
  // 这套正则启发式在 notes 内容变多变复杂后（比如"实习已开放但全职未开"这种
  // 短语里同时含"已开放"和"未开"）会大量误判，本质上是不可靠的、看起来像是
  // "固定不动"（因为猜错的结果不会随人工验证结论的变化而变化）。已改为直接读取
  // job_pool.csv 的结构化列 cohort_match_status（Yes/Unclear/No），这一列由
  // 每轮官网复查后人工/Claude 显式判定并写入，不再靠猜——数据一变，这里跟着变。
  function isCycleOpen(row) {
    return row.cohort_match_status === 'Yes';
  }
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escMultiline(s) {
    return esc(s).replace(/\n/g, '<br>');
  }
  function jobLink(url) {
    try {
      const parsed = new URL(url);
      if (['http:', 'https:'].includes(parsed.protocol)) return `<a href="${esc(parsed.href)}" target="_blank" rel="noopener">${esc(url)}</a>`;
    } catch (_) { /* Display unrecognized URLs as text, never executable links. */ }
    return esc(url);
  }
  function jdFor(row) {
    return (DashboardModel.latestApplication(row, data.appLog, data.jobPool)?.job_description || '').trim();
  }
  function followUpsFor(row) {
    return DashboardModel.recordsForRole(row, data.followUp, data.jobPool)
      .sort((a,b) => ((a.date||'') + (a.time||'')).localeCompare((b.date||'') + (b.time||'')));
  }
  // 投递日期的真实来源是 application_log.csv 的 attempt_date（实际点击提交那天），
  // 不是 job_pool.csv 的 date_found（发现/加入职位池那天）——两者常常不是同一天
  // 按准确岗位关联，再按实际日期选择成功记录，不依赖 CSV 插入顺序。
  function submittedDateFor(r) {
    return DashboardModel.latestApplication(r, data.appLog, data.jobPool)?.attempt_date || '';
  }
  function submittedDateLabel(r) {
    const date = submittedDateFor(r);
    return date ? '投递于 ' + date : '投递日期待核实' + (r.date_found ? ' · 发现于 ' + r.date_found : '');
  }
  function submissionMode(row) {
    const l = DashboardModel.latestApplication(row, data.appLog, data.jobPool);
    if (!l) return { label: '记录方式未知', cls: '' };
    const blob = (l.submission_evidence||'') + (l.notes||'');
    if (blob.indexOf('用户自行') !== -1) return { label: '用户自行投递（未经工具核实）', cls: 'chip-user' };
    if (l.submission_evidence || l.confirmation_text || l.confirmation_url) return { label: '已记录投递证据', cls: 'chip-agent' };
    return { label: '投递证据待补充', cls: '' };
  }
  function currentStage(r) {
    // current_stage on job_pool.csv is set verbatim from the calendar's
    // event-content field (see saveCalendarEvent) — prefer it once set,
    // since it's a direct user action rather than a guess. Fall back to the
    // older follow_up-derived text for rows that predate that column.
    if (r.current_stage && r.current_stage.trim()) return r.current_stage;
    const fu = followUpsFor(r);
    if (!fu.length) return '已投递，等待中';
    const last = fu[fu.length-1];
    return (last.event_type ? last.event_type + '：' : '') + (last.next_action || last.status || '进行中');
  }

  // ---------- home tiles ----------
  function renderHome() {
    const applied = data.jobPool.filter(r => DashboardModel.isRoleRecord(r) && r.status === 'Submitted');
    const rejected = data.jobPool.filter(r => DashboardModel.isRoleRecord(r) && r.status === 'Rejected');
    const offers = data.jobPool.filter(r => DashboardModel.isRoleRecord(r) && r.status === 'Offer');
    const pending = DashboardModel.pendingCompanies(data.jobPool, data.appLog);
    document.getElementById('tile-applied').textContent = applied.length;
    document.getElementById('tile-pending').textContent = pending.length;
    document.getElementById('tile-rejected').textContent = rejected.length;
    document.getElementById('tile-offers').textContent = offers.length;
    document.getElementById('tile-actions').textContent = DashboardModel.actionItems(data.jobPool, data.blockerQueue).length;
  }

  // ---------- card builder ----------
  function cardEl(html) {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = html;
    div.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      div.classList.toggle('open');
    });
    return div;
  }

  // ---------- record outcome ----------
  async function recordOutcome(r, status, btn) {
    btn.disabled = true;
    try {
      const res = await fetch('/api/update-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rowIndex: r.__rowIndex, company: r.company, job_title: r.job_title, job_url: r.job_url || '', status }),
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok || !result.ok) throw new Error(result.error || ('HTTP ' + res.status));
      location.reload(); // Refresh home counts, active applications, and both outcome lists together.
    } catch (e) {
      alert('更新失败：' + e.message);
      btn.disabled = false;
    }
  }

  // ---------- applied view ----------
  function renderApplied() {
    const listEl = document.getElementById('applied-list');
    const catSel = document.getElementById('applied-filter-cat');
    const search = document.getElementById('applied-search');

    let rows = data.jobPool.filter(r => DashboardModel.isRoleRecord(r) && r.status === 'Submitted');

    // populate category filter once
    if (catSel.options.length <= 1) {
      const cats = [...new Set(rows.map(category))].sort(compareCategories);
      cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; catSel.appendChild(o); });
    }

    function draw() {
      let filtered = rows.slice();
      if (catSel.value) filtered = filtered.filter(r => category(r) === catSel.value);
      if (search.value.trim()) {
        const q = search.value.trim().toLowerCase();
        filtered = filtered.filter(r => (r.company||'').toLowerCase().includes(q));
      }
      filtered.sort((a,b) => (submittedDateFor(b)||'').localeCompare(submittedDateFor(a)||''));

      listEl.innerHTML = '';
      if (!filtered.length) { listEl.innerHTML = '<div class="empty">没有匹配的记录</div>'; return; }

      filtered.forEach(r => {
        const cat = category(r);
        const mode = submissionMode(r);
        const stage = currentStage(r);
        const fu = followUpsFor(r);
        const timeline = fu.map(f => `<div class="timeline-item">${esc(f.date)} — ${esc(f.event_type)}：${esc(f.status)} ${esc(f.next_action)}</div>`).join('') || '<div class="timeline-item">暂无跟进记录</div>';
        const jd = jdFor(r);

        const html = `
          <div class="card-top">
            <div>
              <div class="card-title">${esc(r.company)} · ${esc(r.job_title)}</div>
              <div class="card-sub">${esc(stage)}</div>
              <div class="tags">
                <span class="chip ${catChipClass(cat)}">${esc(cat)}</span>
                <span class="chip ${mode.cls}">${esc(mode.label)}</span>
              </div>
            </div>
            <div class="card-right">${esc(submittedDateLabel(r))}</div>
          </div>
          <div class="detail">
            <dt>职位/城市</dt><dd>${esc(r.job_title)} · ${esc(r.location)}</dd>
            ${classificationDetail(r)}
            <dt>岗位描述（JD）</dt><dd>${jd ? escMultiline(jd) : '暂未记录，可在 application_log.csv 的 job_description 列补充'}</dd>
            <dt>备注</dt><dd>${esc(r.notes)}</dd>
            <dt>next_action</dt><dd>${esc(r.next_action)}</dd>
            ${r.job_url ? `<dt>链接</dt><dd>${jobLink(r.job_url)}</dd>` : ''}
            <dt>跟进时间线</dt><dd>${timeline}</dd>
            <div class="end-progress">
              <button class="btn end-trigger">记录投递结果</button>
              <div class="end-choices hidden">
                <button class="btn btn-good end-choice" data-status="Offer">拿到 Offer</button>
                <button class="btn btn-bad end-choice" data-status="Rejected">已挂</button>
              </div>
            </div>
          </div>`;
        const card = cardEl(html);
        const endTrigger = card.querySelector('.end-trigger');
        const endChoices = card.querySelector('.end-choices');
        endTrigger.addEventListener('click', (e) => {
          e.stopPropagation();
          endChoices.classList.toggle('hidden');
        });
        card.querySelectorAll('.end-choice').forEach(choiceBtn => {
          choiceBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            recordOutcome(r, choiceBtn.dataset.status, choiceBtn);
          });
        });
        listEl.appendChild(card);
      });
    }
    catSel.onchange = draw;
    search.oninput = draw;
    draw();
  }

  // ---------- pending view ----------
  function renderPending() {
    const openEl = document.getElementById('pending-open-list');
    const notOpenEl = document.getElementById('pending-notopen-list');
    const catSel = document.getElementById('pending-filter-cat');
    const prioSel = document.getElementById('pending-filter-priority');
    const citySel = document.getElementById('pending-filter-city');
    const search = document.getElementById('pending-search');

    const companies = DashboardModel.pendingCompanies(data.jobPool, data.appLog);
    const rows = companies.flatMap(company => company.rows);

    if (catSel.options.length <= 1) {
      [...new Set(rows.map(category))].sort(compareCategories).forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; catSel.appendChild(o); });
    }
    if (prioSel.options.length <= 1) {
      [...new Set(rows.map(r => r.priority).filter(Boolean))].sort().forEach(p => { const o=document.createElement('option'); o.value=p; o.textContent=p; prioSel.appendChild(o); });
    }
    if (citySel.options.length <= 1) {
      [...new Set(rows.map(r => r.location).filter(Boolean))].sort().forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; citySel.appendChild(o); });
    }

    function companyCard(company) {
      const unique = values => [...new Set(values.filter(Boolean))];
      const cats = unique(company.rows.map(category));
      const cities = unique(company.rows.map(r => r.location));
      const priorities = unique(company.rows.map(r => r.priority));
      const unclearChip = company.cohort_match_status === 'Unclear' ? '<span class="chip chip-warning">状态不明确，需人工复核</span>' : '';
      const details = company.rows.map(r => `
        <section class="pending-role">
          <h3>${esc(r.job_title || r.role_family || '待研究岗位')}</h3>
          <div>${esc(r.location || '城市待确认')} · 优先级 ${esc(r.priority || '待定')} · ${r.cohort_match_status === 'Yes' ? '已确认开放' : r.cohort_match_status === 'No' ? '未确认有可投岗位' : '开放状态待核实'}</div>
          <dt>下一步</dt><dd>${esc(r.next_action)}</dd>
          <dt>备注</dt><dd>${escMultiline(r.notes)}</dd>
          ${r.job_url ? `<dt>链接</dt><dd>${jobLink(r.job_url)}</dd>` : ''}
        </section>`).join('');
      const html = `
        <div class="card-top">
          <div>
            <div class="card-title">${esc(company.company)}</div>
            <div class="card-sub">${company.rows.length} 条岗位 / 方向线索 · ${esc(cities.join('、') || '城市待确认')}</div>
            <div class="tags">
              ${cats.map(cat => `<span class="chip ${catChipClass(cat)}">${esc(cat)}</span>`).join('')}
              <span class="chip">优先级 ${esc(priorities.join(' / ') || '待定')}</span>
              ${unclearChip}
            </div>
          </div>
          <div class="card-right">展开查看岗位</div>
        </div>
        <div class="detail">${classificationDetail(company.rows[0])}${details}</div>`;
      return cardEl(html);
    }

    function draw() {
      const query = DashboardModel.companyKey(search.value);
      const filtered = DashboardModel.pendingCompanies(data.jobPool, data.appLog, r =>
        (!catSel.value || category(r) === catSel.value) &&
        (!prioSel.value || r.priority === prioSel.value) &&
        (!citySel.value || r.location === citySel.value) &&
        (!query || DashboardModel.companyKey(r.company).includes(query)));
      const openRows = filtered.filter(isCycleOpen);
      const notOpenRows = filtered.filter(r => !isCycleOpen(r));

      document.getElementById('pending-open-title').textContent = `已确认开放，还没投（${openRows.length} 家公司）`;
      document.getElementById('pending-notopen-title').textContent = `未开 / 状态不明（${notOpenRows.length} 家公司）`;

      openEl.innerHTML = '';
      notOpenEl.innerHTML = '';
      openEl.innerHTML = openRows.length ? '' : '<div class="empty">没有匹配的记录</div>';
      notOpenEl.innerHTML = notOpenRows.length ? '' : '<div class="empty">没有匹配的记录</div>';
      openRows.forEach(company => openEl.appendChild(companyCard(company)));
      notOpenRows.forEach(company => notOpenEl.appendChild(companyCard(company)));
    }
    catSel.onchange = draw; prioSel.onchange = draw; citySel.onchange = draw; search.oninput = draw;
    draw();
  }

  // ---------- consolidated action items ----------
  function renderActions() {
    const listEl = document.getElementById('actions-list');
    const search = document.getElementById('actions-search');
    const expandBtn = document.getElementById('actions-expand');
    const items = DashboardModel.actionItems(data.jobPool, data.blockerQueue);
    let expanded = false;
    const field = (label, value) => value ? `<dt>${esc(label)}</dt><dd>${escMultiline(value)}</dd>` : '';
    function draw() {
      const query = DashboardModel.companyKey(search.value);
      const filtered = items.filter(item => !query || DashboardModel.companyKey([
        item.company, ...item.titles,
        ...item.rows.flatMap(row => [row.current_stage, row.blocker, row.next_action]),
        ...item.blockers.flatMap(row => [row.blocker_category, row.what_happened, row.why_blocked, row.user_action_needed, row.next_retry_strategy]),
      ].join(' ')).includes(query));
      document.getElementById('actions-count').textContent = `${filtered.length} 组待办 · 岗位池 ${filtered.reduce((n, item) => n + item.rows.length, 0)} 条 · 未关闭问题 ${filtered.reduce((n, item) => n + item.blockers.length, 0)} 项`;
      listEl.innerHTML = filtered.length ? '' : '<div class="empty">没有匹配的未完成事项</div>';
      filtered.forEach(item => {
        const progress = [...new Set(item.rows.map(row => row.current_stage).filter(Boolean))].join('；');
        const categories = [...new Set(item.blockers.map(row => row.blocker_category).filter(Boolean))];
        const poolDetails = item.rows.map(row => `<section class="action-section">
          ${field('岗位进度 · ' + (row.job_title || '待核实岗位'), row.current_stage || row.status)}
          ${field('阻塞 / 待补信息', row.blocker)}${field('下一步', row.next_action)}
          ${row.job_url ? `<dt>岗位入口</dt><dd>${jobLink(row.job_url)}</dd>` : ''}
        </section>`).join('');
        const blockerDetails = item.blockers.map((row, index) => `<section class="action-section">
          ${field('未关闭事项 ' + (index + 1) + ' · ' + (row.blocker_category || '待复核'), row.what_happened || row.why_blocked || '尚未填写经过')}
          ${field('原因', row.why_blocked)}${field('需要补充 / 操作', row.user_action_needed)}
          ${field('恢复后下一步', row.next_retry_strategy)}
          ${field('记录日期 / 状态', [row.date, row.status].filter(Boolean).join(' · '))}
          ${row.job_url ? `<dt>问题现场</dt><dd>${jobLink(row.job_url)}</dd>` : ''}
        </section>`).join('');
        const card = cardEl(`<div class="card-top"><div>
          <div class="card-title">${esc(item.company || '公司待核实')} · ${esc(item.titles.join(' / ') || '岗位待核实')}</div>
          <div class="card-sub">${esc(progress || item.blockers[0]?.what_happened || '展开查看剩余事项')}</div>
          <div class="tags">${categories.map(value => `<span class="chip chip-warning">${esc(value)}</span>`).join('')}
            ${item.rows.some(row => row.status === 'Blocked') ? '<span class="chip chip-critical">流程阻塞</span>' : ''}
            ${item.rows.some(row => row.status === 'Needs user') ? '<span class="chip">待补信息 / 选择</span>' : ''}
          </div>
        </div></div><div class="detail">${poolDetails}${blockerDetails}</div>`);
        card.classList.add('action-card');
        card.classList.toggle('open', expanded);
        listEl.appendChild(card);
      });
    }
    search.oninput = draw;
    expandBtn.onclick = () => {
      expanded = !expanded;
      expandBtn.textContent = expanded ? '收起全部' : '展开全部';
      listEl.querySelectorAll('.card').forEach(card => card.classList.toggle('open', expanded));
    };
    draw();
  }

  // ---------- separate outcome views ----------
  function renderOutcome(view, status) {

    const catSel = document.getElementById(view + '-filter-cat');
    const search = document.getElementById(view + '-search');
    const rows = data.jobPool.filter(r => DashboardModel.isRoleRecord(r) && r.status === status);
    if (catSel.options.length <= 1) {
      [...new Set(rows.map(category))].sort(compareCategories).forEach(cat => {
        const option = document.createElement('option');
        option.value = cat; option.textContent = cat; catSel.appendChild(option);
      });
    }

    function draw() {
      let filtered = rows.slice();
      if (catSel.value) filtered = filtered.filter(r => category(r) === catSel.value);
      const query = DashboardModel.companyKey(search.value);
      if (query) {
        filtered = filtered.filter(r => DashboardModel.companyKey(r.company).includes(query) ||
          DashboardModel.companyKey(r.job_title).includes(query));
      }
      filtered.sort((a,b) => (submittedDateFor(b)||'').localeCompare(submittedDateFor(a)||''));

                ${resultChip}
              </div>

          </div>
          <div class="detail">
            <dt>岗位描述（JD）</dt><dd>${jd ? escMultiline(jd) : '暂未记录'}</dd>

            <dt>备注</dt><dd>${esc(r.notes)}</dd>
          </div>`;
        listEl.appendChild(cardEl(html));

    catSel.onchange = draw;
    search.oninput = draw;
    draw();

  // ---------- calendar ----------
  let calSelectedJob = null;   // job_pool row the form currently has selected
  let calEditingRowIndex = null; // follow_up.csv rowIndex when editing an existing event, null when adding
  let calExpectedEvent = null; // Original values protect against concurrent CSV edits.

  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dayLabel(d, isToday) {
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const label = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + weekdays[d.getDay()];
    return isToday ? '今天 · ' + label : label;
  }

  function renderCalendar() {
    const weekEl = document.getElementById('calendar-week');
    weekEl.innerHTML = '';
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    for (let i = 0; i < 7; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() + i);
      const iso = ymd(d);
      const dayEvents = data.followUp
        .filter(f => f.date === iso)
        .sort((a, b) => (a.time || '').localeCompare(b.time || ''));

      const dayEl = document.createElement('div');
      dayEl.className = 'calendar-day' + (i === 0 ? ' is-today' : '');
      const header = document.createElement('div');
      header.className = 'calendar-day-header';
      header.textContent = dayLabel(d, i === 0);
      dayEl.appendChild(header);

      if (!dayEvents.length) {
        const empty = document.createElement('div');
        empty.className = 'calendar-empty-day';
        empty.textContent = '无安排';
        dayEl.appendChild(empty);
      } else {
        dayEvents.forEach(ev => {
          const evEl = document.createElement('div');
          evEl.className = 'calendar-event';
          evEl.innerHTML =
            '<div><span class="calendar-event-time">' + esc(ev.time) + '</span> ' + esc(ev.company) + '</div>' +
            '<div>' + esc(ev.job_title) + ' · ' + esc(ev.event_type) + '</div>' +
            '<div class="calendar-event-actions"><button data-act="edit">编辑</button><button data-act="delete">删除</button></div>';
          evEl.querySelector('[data-act="edit"]').addEventListener('click', () => openCalendarForm(ev));
          evEl.querySelector('[data-act="delete"]').addEventListener('click', () => deleteCalendarEvent(ev));
          dayEl.appendChild(evEl);
        });
      }
      weekEl.appendChild(dayEl);
    }
  }

  function resetCalendarForm() {
    document.getElementById('cal-date').value = '';
    document.getElementById('cal-time').value = '';
    document.getElementById('cal-company-search').value = '';
    document.getElementById('cal-event-type').value = '';
    document.getElementById('cal-form-error').classList.add('hidden');
    document.getElementById('cal-company-results').classList.add('hidden');
    document.getElementById('cal-selected-job').classList.add('hidden');
    calSelectedJob = null;
    calEditingRowIndex = null;
    calExpectedEvent = null;
    document.getElementById('cal-save-btn').disabled = false;
  }

  function selectCalendarJob(r) {
    calSelectedJob = r;
    document.getElementById('cal-company-search').value = r.company + ' · ' + r.job_title;
    document.getElementById('cal-company-results').classList.add('hidden');
    const sel = document.getElementById('cal-selected-job');
    sel.textContent = '已选择：' + r.company + ' · ' + r.job_title;
    sel.classList.remove('hidden');
  }

  function openCalendarForm(existingEvent) {
    resetCalendarForm();
    document.getElementById('calendar-form').classList.remove('hidden');
    if (existingEvent) {
      calEditingRowIndex = existingEvent.__rowIndex;
      calExpectedEvent = { date: existingEvent.date, time: existingEvent.time, event_type: existingEvent.event_type };
      document.getElementById('cal-date').value = existingEvent.date;
      document.getElementById('cal-time').value = existingEvent.time;
      document.getElementById('cal-event-type').value = existingEvent.event_type;
      const matches = data.jobPool.filter(r => r.company === existingEvent.company && r.job_title === existingEvent.job_title &&
        (!existingEvent.job_url || r.job_url === existingEvent.job_url) && DashboardModel.isRoleRecord(r) && r.status === 'Submitted');
      if (matches.length === 1) {
        selectCalendarJob(matches[0]);
      } else {
        const sel = document.getElementById('cal-selected-job');
        sel.textContent = matches.length > 1 ? '有多个同名岗位，需重新搜索并选择对应岗位' : '找不到对应的"已投递"岗位了（可能状态已变化）— 需要重新搜索选择';
        sel.classList.remove('hidden');
      }
    }
  }

  function searchCalendarCompanies(q) {
    const resultsEl = document.getElementById('cal-company-results');
    const query = q.trim().toLowerCase();
    if (!query) { resultsEl.classList.add('hidden'); resultsEl.innerHTML = ''; return; }
    const pool = data.jobPool.filter(r => DashboardModel.isRoleRecord(r) && r.status === 'Submitted');
    const matches = pool.filter(r =>
      (r.company || '').toLowerCase().includes(query) || (r.job_title || '').toLowerCase().includes(query)
    ).slice(0, 8);
    resultsEl.innerHTML = '';
    if (!matches.length) {
      resultsEl.innerHTML = '<div style="padding:8px 10px;font-size:12px;color:var(--text-muted);">没有匹配"已投递"里的公司/岗位</div>';
      resultsEl.classList.remove('hidden');
      return;
    }
    matches.forEach(r => {
      const btn = document.createElement('button');
      btn.textContent = r.company + ' · ' + r.job_title + (r.location ? ' · ' + r.location : '');
      btn.title = r.job_url || '';
      btn.addEventListener('click', () => selectCalendarJob(r));
      resultsEl.appendChild(btn);
    });
    resultsEl.classList.remove('hidden');
  }

  async function saveCalendarEvent() {
    const errEl = document.getElementById('cal-form-error');
    errEl.classList.add('hidden');
    const date = document.getElementById('cal-date').value;
    const time = document.getElementById('cal-time').value;
    const event_type = document.getElementById('cal-event-type').value.trim();
    if (!date || !time || !event_type || !calSelectedJob) {
      errEl.textContent = '日期、时间、公司/岗位、事件内容都要填';
      errEl.classList.remove('hidden');
      return;
    }
    const saveBtn = document.getElementById('cal-save-btn');
    saveBtn.disabled = true;
    try {
      const isEdit = calEditingRowIndex !== null;
      const body = isEdit
        ? { followUpRowIndex: calEditingRowIndex, expectedEvent: calExpectedEvent, jobRowIndex: calSelectedJob.__rowIndex, company: calSelectedJob.company, job_title: calSelectedJob.job_title, job_url: calSelectedJob.job_url || '', date, time, event_type }
        : { jobRowIndex: calSelectedJob.__rowIndex, company: calSelectedJob.company, job_title: calSelectedJob.job_title, job_url: calSelectedJob.job_url || '', date, time, event_type };
      const res = await fetch(isEdit ? '/api/calendar/update' : '/api/calendar/add', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok || !result.ok) throw new Error(result.error || ('HTTP ' + res.status));
      location.reload(); // same full-reload pattern as elsewhere in this dashboard
    } catch (e) {
      errEl.textContent = '保存失败：' + e.message;
      errEl.classList.remove('hidden');
      saveBtn.disabled = false;
    }
  }

  async function deleteCalendarEvent(ev) {
    if (!confirm('删除这条日程：' + ev.date + ' ' + ev.time + ' ' + ev.company + ' · ' + ev.event_type + '？')) return;
    try {
      const res = await fetch('/api/calendar/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ followUpRowIndex: ev.__rowIndex, company: ev.company, job_title: ev.job_title, event_type: ev.event_type, date: ev.date, time: ev.time }),
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok || !result.ok) throw new Error(result.error || ('HTTP ' + res.status));
      location.reload();
    } catch (e) {
      alert('删除失败：' + e.message);
    }
  }

  document.getElementById('calendar-add-btn').addEventListener('click', () => openCalendarForm(null));
  document.getElementById('cal-cancel-btn').addEventListener('click', () => {
    document.getElementById('calendar-form').classList.add('hidden');
    resetCalendarForm();
  });
  document.getElementById('cal-save-btn').addEventListener('click', saveCalendarEvent);
  document.getElementById('cal-company-search').addEventListener('input', (e) => {
    calSelectedJob = null;
    document.getElementById('cal-selected-job').classList.add('hidden');
    searchCalendarCompanies(e.target.value);
  });
  document.addEventListener('click', (e) => {
    const input = document.getElementById('cal-company-search');
    const results = document.getElementById('cal-company-results');
    if (e.target !== input && !results.contains(e.target)) results.classList.add('hidden');
  });

  // ---------- navigation ----------
  function showView(name) {
    ['home','applied','pending','rejected','offers','actions'].forEach(v => {
      document.getElementById(v + '-view').classList.toggle('hidden', v !== name);
    });
  }
  document.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => showView(t.dataset.view)));
  document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => showView('home')));

  // ---------- load / refresh ----------
  const refreshBtn = document.getElementById('refresh-btn');
  // 整页重新加载而不是只调 loadAll()：如果 dashboard.html 本身的代码被改过
  // （比如这次修的投递日期字段来源），只刷新 CSV 数据看不到效果，必须连页面
  // 的 JS 一起重新拉取，否则浏览器里跑的还是改之前缓存在内存里的旧逻辑。
  refreshBtn.addEventListener('click', () => location.reload());

  loadAll();

})();
</script>

</body>
</html>
